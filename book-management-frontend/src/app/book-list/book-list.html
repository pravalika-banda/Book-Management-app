<div class="container">
  <h1 class="title">📚 Book Collection</h1>

  <div class="top-actions">
    <button routerLink="/AddBook" class="btn-add">➕ Add New Book</button>
  </div>

  <!-- Loader -->
  <div *ngIf="loading" class="loader-container">
    <div class="loader"></div>
  </div>

  <!-- Books Grid -->
  <div class="books-grid" *ngIf="!loading && books.length > 0">
    <div class="book-card" *ngFor="let book of books">
      <div class="img-wrapper">
        <img [src]="book.coverUrl" alt="{{ book.title }}" class="book-img" />
      </div>

      <p class="author">by {{ book.author }}</p>

      <div class="actions">
        <button
          [routerLink]="['/EditBook']"
          [queryParams]="{ id: book._id }"
          class="btn action-edit"
        >
          ✏️ Edit
        </button>

        <button (click)="deleteBook(book._id)" class="btn action-delete">🗑️ Delete</button>

        <button
          [routerLink]="['/BookDetail']"
          [queryParams]="{ id: book._id }"
          class="btn action-details"
        >
          🔍 View
        </button>
      </div>
    </div>
  </div>

  <!-- No books -->
  <div class="no-books" *ngIf="!loading && books.length === 0">
    <p>No books available. Add your first book!</p>
  </div>
</div>
